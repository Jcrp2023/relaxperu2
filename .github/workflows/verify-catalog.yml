name: Verificar catálogo

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Probar importadores
        run: python -m unittest discover -s scripts -p 'test_*.py'
      - name: Instalar dependencias
        run: npm ci
      - name: Probar catálogo
        run: npm test
      - name: Auditar cobertura y diferencia con main
        run: node scripts/radar_health.mjs --base-ref origin/main
      - name: Adjuntar cola y cobertura editorial
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: radar-editorial-pr
          path: fuentes/radar-health.json
          if-no-files-found: warn
      - name: Compilar
        run: npm run build
